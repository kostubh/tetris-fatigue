<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris with Speed Brake</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>Tetris Fatigue</h1>
            <p class="tagline">Control your speed with the brake!</p>
        </div>

        <div class="game-area">
            <!-- Left sidebar with stats and brake -->
            <div class="sidebar left-sidebar">
                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-label">Score</span>
                        <span class="stat-value" id="score">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Level</span>
                        <span class="stat-value" id="level">1</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Speed</span>
                        <span class="stat-value" id="speed">1.0x</span>
                    </div>
                </div>

                <div class="brake-panel">
                    <button id="brakeBtn" class="brake-button">
                        <span class="brake-icon">🛑</span>
                        <span class="brake-text">BRAKE</span>
                    </button>
                    <div class="brake-info">
                        <div class="brake-meter">
                            <div id="brakeMeter" class="brake-meter-fill"></div>
                        </div>
                        <div class="brake-cooldown">
                            <span id="brakeStatus">Ready</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main game canvas -->
            <div class="game-canvas-wrapper">
                <canvas id="tetris" width="240" height="400"></canvas>
                <div id="gameOver" class="game-over hidden">
                    <h2>Game Over!</h2>
                    <p>Score: <span id="finalScore">0</span></p>
                    <button id="restartBtn" class="btn">Restart</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Speed increases automatically. Use the brake strategically!</p>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
